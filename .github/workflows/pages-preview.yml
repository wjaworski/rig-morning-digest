name: Publish digest preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - name: Install dependencies
        run: pnpm install --no-lockfile
      - name: Run tests and typecheck
        run: pnpm test && pnpm typecheck
      - name: Save the unmarked digest HTML
        env:
          LANE_ID: lane-07
          PORT: 8787
        run: |
          pnpm start > /tmp/rig.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/health >/dev/null; then
              break
            fi
            sleep 1
          done
          mkdir -p dist
          curl --fail --silent http://127.0.0.1:8787/digest/2026-10-28 -o dist/digest.html
          grep -q 'no marker set' dist/digest.html
          if grep -q 'czbi-m2hu' dist/digest.html; then
            echo 'Lane marker unexpectedly present in preview' >&2
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
